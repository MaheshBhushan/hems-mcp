[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hems-mcp"
version = "0.1.0"
description = "Local household energy forecasts and charging scenario exploration over MCP"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp>=1.28,<2", "numpy>=1.26", "pandas>=2.2", "pydantic>=2.11,<3", "httpx>=0.27"]

[project.optional-dependencies]
chronos = ["chronos-forecasting>=2,<3", "torch>=2.2"]

[project.scripts]
hems-mcp = "hems_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/hems_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
